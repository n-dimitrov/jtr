[project]
name = "jtr"
version = "1.0.0"
description = "Local CLI for Jira / Track & Release (Server/Data Center and Cloud) tickets — read, comment, edit, transition with preview/confirm safety."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["jira", "cli", "jira-server", "jira-data-center", "jira-cloud", "track-release", "tracker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "websocket-client>=1.7",
    "rich>=13.7",
    "platformdirs>=4.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
jtr = "jtr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jtr"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
